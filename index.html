<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness & Tracker PWA Pro</title>
    <!-- Tailwind CSS CDN per layout responsive e moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS per Import/Export Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="p-4 max-w-xl mx-auto pb-12">

    <!-- HEADER / DASHBOARD CONTATORI -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 mb-4 shadow-lg">
        <div class="flex justify-between items-center mb-3">
            <h1 class="text-xl font-bold text-emerald-400 flex items-center gap-2">
                <i class="ph ph-barbell text-2xl"></i> Fitness Tracker
            </h1>
            <span class="text-xs bg-slate-700 text-slate-300 px-2 py-1 rounded-md font-mono" id="activeSchedaBadge">
                Scheda: Nessuna
            </span>
        </div>
        
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-900/60 p-3 rounded-lg border border-slate-700/50 text-center">
                <p class="text-xs text-slate-400 mb-1">Giorni senza Allenamento</p>
                <p class="text-2xl font-black text-emerald-400" id="daysSinceLastWorkout">-</p>
            </div>
            <div class="bg-slate-900/60 p-3 rounded-lg border border-slate-700/50 text-center">
                <p class="text-xs text-slate-400 mb-1">Allenamenti Totali</p>
                <p class="text-2xl font-black text-blue-400" id="totalWorkoutsCount">0</p>
            </div>
        </div>
    </div>

    <!-- 1. REGISTRAZIONE RAPIDA ALLENAMENTO (IN ALTO) -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 mb-4 shadow-lg">
        <h2 class="text-base font-semibold text-emerald-400 mb-3 flex items-center gap-2">
            <i class="ph ph-plus-circle text-lg"></i> Nuova Registrazione Allenamento
        </h2>
        <div class="space-y-3">
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Data</label>
                    <input type="date" id="logDate" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Versione Scheda</label>
                    <select id="logSchedaSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                        <option value="">Seleziona...</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Dettagli / Note Sessione</label>
                <input type="text" id="logDetails" placeholder="Es. Giorno A - Panca 4x8 @80kg, Squat 3x10" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>
            <button onclick="addWorkoutLog()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 rounded-lg text-sm transition-colors flex items-center justify-center gap-2">
                <i class="ph ph-check-circle text-lg"></i> Salva Registrazione
            </button>
        </div>
    </div>

    <!-- 2. REPOSITORY SCHEDE (MINIMALE E COMPATTA) -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 mb-4 shadow-lg">
        <div class="flex justify-between items-center mb-3">
            <h2 class="text-base font-semibold text-emerald-400 flex items-center gap-2">
                <i class="ph ph-folders text-lg"></i> Repository Schede
            </h2>
            <button onclick="downloadExcelTemplate()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1 rounded-md transition-colors flex items-center gap-1">
                <i class="ph ph-download-simple"></i> Template .xlsx
            </button>
        </div>

        <!-- Caricamento Nuova Scheda -->
        <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700/60 mb-3 space-y-2">
            <input type="text" id="schedaVersionName" placeholder="Nome versione (es. Ipertrofia Q4 2026)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-emerald-500">
            <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" class="block w-full text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-slate-200 hover:file:bg-slate-600">
            <button onclick="uploadSchedaToRepository()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-semibold py-1.5 rounded-lg text-xs transition-colors flex items-center justify-center gap-1">
                <i class="ph ph-upload-simple"></i> Carica in Repository
            </button>
        </div>

        <!-- Selettore Scheda Attiva e Azioni (Minimale) -->
        <div class="space-y-2">
            <label class="block text-xs text-slate-400">Scheda Attiva Selezionata</label>
            <div class="flex gap-2">
                <select id="repositorySelect" onchange="switchActiveScheda()" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-emerald-500"></select>
                <button onclick="downloadCurrentScheda()" title="Download file versione" class="bg-slate-700 hover:bg-slate-600 text-blue-400 p-2 rounded-lg text-sm transition-colors">
                    <i class="ph ph-download-simple"></i>
                </button>
                <button onclick="deleteCurrentScheda()" title="Elimina versione" class="bg-slate-700 hover:bg-slate-600 text-red-400 p-2 rounded-lg text-sm transition-colors">
                    <i class="ph ph-trash"></i>
                </button>
            </div>
        </div>

        <!-- Anteprima Minimale Rifiutabile / Espandibile -->
        <details class="mt-3 text-xs text-slate-400 bg-slate-900/40 rounded-lg border border-slate-700/40 p-2">
            <summary class="cursor-pointer font-medium text-slate-300 hover:text-emerald-400 flex items-center justify-between">
                <span>Anteprima rapida contenuto scheda</span>
                <i class="ph ph-caret-down"></i>
            </summary>
            <div id="schedaContainer" class="mt-2 overflow-x-auto max-h-40"></div>
        </details>
    </div>

    <!-- 3. STORICO ALLENAMENTI ED ESPORTAZIONE -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg">
        <div class="flex justify-between items-center mb-3">
            <h2 class="text-base font-semibold text-emerald-400 flex items-center gap-2">
                <i class="ph ph-clock-counter-clockwise text-lg"></i> Storico Registrazioni
            </h2>
            <button onclick="exportWorkoutsToExcel()" class="text-xs bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-3 py-1 rounded-md transition-colors flex items-center gap-1">
                <i class="ph ph-file-xls text-sm"></i> Esporta XLSX
            </button>
        </div>

        <div id="historyList" class="space-y-2 max-h-80 overflow-y-auto pr-1">
            <!-- Popolato via JS -->
        </div>
    </div>

    <script>
        // Inizializzazione Database Locale
        let db = {
            repository: JSON.parse(localStorage.getItem('pwa_repository')) || {},
            activeSchedaKey: localStorage.getItem('pwa_active_scheda') || null,
            workouts: JSON.parse(localStorage.getItem('pwa_workouts')) || []
        };

        document.addEventListener('DOMContentLoaded', () => {
            // Imposta data odierna come default
            document.getElementById('logDate').value = new Date().toISOString().split('T')[0];
            
            renderRepositorySelect();
            renderActiveScheda();
            renderWorkouts();
            updateDashboardCounters();
        });

        // 1. CARICAMENTO SCHEDA IN REPOSITORY
        function uploadSchedaToRepository() {
            const versionName = document.getElementById('schedaVersionName').value.trim();
            const fileInput = document.getElementById('excelFileInput');
            const file = fileInput.files[0];

            if (!versionName) {
                alert("Inserisci un nome per identificare la versione della scheda!");
                return;
            }
            if (!file) {
                alert("Seleziona un file Excel (.xlsx / .csv)!");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);

                db.repository[versionName] = jsonData;
                db.activeSchedaKey = versionName;

                localStorage.setItem('pwa_repository', JSON.stringify(db.repository));
                localStorage.setItem('pwa_active_scheda', db.activeSchedaKey);

                document.getElementById('schedaVersionName').value = '';
                fileInput.value = '';

                renderRepositorySelect();
                renderActiveScheda();
            };
            reader.readAsArrayBuffer(file);
        }

        // 2. GESTIONE REPOSITORY E SELEZIONE SCHEDE
        function renderRepositorySelect() {
            const selectRepo = document.getElementById('repositorySelect');
            const selectLog = document.getElementById('logSchedaSelect');
            selectRepo.innerHTML = '';
            selectLog.innerHTML = '<option value="">Nessuna / Allenamento Libero</option>';

            const keys = Object.keys(db.repository);
            if (keys.length === 0) {
                selectRepo.innerHTML = '<option value="">Nessuna scheda presente</option>';
                return;
            }

            keys.forEach(key => {
                const opt1 = document.createElement('option');
                opt1.value = key;
                opt1.textContent = key;
                if (key === db.activeSchedaKey) opt1.selected = true;
                selectRepo.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = key;
                opt2.textContent = key;
                if (key === db.activeSchedaKey) opt2.selected = true;
                selectLog.appendChild(opt2);
            });
        }

        function switchActiveScheda() {
            const select = document.getElementById('repositorySelect');
            if (!select.value) return;

            db.activeSchedaKey = select.value;
            localStorage.setItem('pwa_active_scheda', db.activeSchedaKey);
            renderActiveScheda();
        }

        // 3. DOWNLOAD ED ELIMINAZIONE SINGOLA SCHEDA
        function downloadCurrentScheda() {
            if (!db.activeSchedaKey || !db.repository[db.activeSchedaKey]) {
                alert("Nessuna scheda selezionata da scaricare!");
                return;
            }
            const data = db.repository[db.activeSchedaKey];
            const worksheet = XLSX.utils.json_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Scheda");
            XLSX.writeFile(workbook, `${db.activeSchedaKey.replace(/\s+/g, '_')}.xlsx`);
        }

        function deleteCurrentScheda() {
            if (!db.activeSchedaKey || !db.repository[db.activeSchedaKey]) {
                alert("Nessuna scheda selezionata da eliminare!");
                return;
            }
            if (!confirm(`Sei sicuro di voler eliminare la versione "${db.activeSchedaKey}" dalla repository?`)) {
                return;
            }

            delete db.repository[db.activeSchedaKey];
            const remainingKeys = Object.keys(db.repository);
            db.activeSchedaKey = remainingKeys.length > 0 ? remainingKeys[0] : null;

            localStorage.setItem('pwa_repository', JSON.stringify(db.repository));
            if (db.activeSchedaKey) {
                localStorage.setItem('pwa_active_scheda', db.activeSchedaKey);
            } else {
                localStorage.removeItem('pwa_active_scheda');
            }

            renderRepositorySelect();
            renderActiveScheda();
        }

        // 4. ANTEPRIMA MINIMALE
        function renderActiveScheda() {
            const container = document.getElementById('schedaContainer');
            const badge = document.getElementById('activeSchedaBadge');

            if (!db.activeSchedaKey || !db.repository[db.activeSchedaKey]) {
                badge.textContent = "Scheda: Nessuna";
                container.innerHTML = '<p class="text-slate-500 italic">Nessuna scheda caricata o selezionata.</p>';
                return;
            }

            badge.textContent = `Scheda: ${db.activeSchedaKey}`;
            const data = db.repository[db.activeSchedaKey];

            if (data.length === 0) {
                container.innerHTML = '<p class="text-slate-500 italic">File vuoto.</p>';
                return;
            }

            let html = '<table class="w-full text-left text-xs border-collapse"><thead><tr class="border-b border-slate-700 text-emerald-400">';
            Object.keys(data[0]).forEach(k => html += `<th class="p-1">${k}</th>`);
            html += '</tr></thead><tbody>';
            data.forEach(row => {
                html += '<tr class="border-b border-slate-800/60 text-slate-300">';
                Object.values(row).forEach(v => html += `<td class="p-1">${v || '-'}</td>`);
                html += '</tr>';
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // 5. REGISTRAZIONE E STORICO ALLENAMENTI
        function addWorkoutLog() {
            const date = document.getElementById('logDate').value;
            const scheda = document.getElementById('logSchedaSelect').value || 'Generica';
            const details = document.getElementById('logDetails').value.trim();

            if (!date) {
                alert("Seleziona una data per la registrazione!");
                return;
            }

            db.workouts.unshift({
                id: Date.now(),
                date,
                scheda,
                details: details || 'Allenamento completato'
            });

            // Ordina per data decrescente
            db.workouts.sort((a, b) => new Date(b.date) - new Date(a.date));

            localStorage.setItem('pwa_workouts', JSON.stringify(db.workouts));
            document.getElementById('logDetails').value = '';

            renderWorkouts();
            updateDashboardCounters();
        }

        function deleteWorkoutLog(id) {
            if (!confirm("Vuoi davvero eliminare questa registrazione dallo storico?")) return;
            db.workouts = db.workouts.filter(w => w.id !== id);
            localStorage.setItem('pwa_workouts', JSON.stringify(db.workouts));
            renderWorkouts();
            updateDashboardCounters();
        }

        function renderWorkouts() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';

            if (db.workouts.length === 0) {
                list.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Nessuna registrazione presente nello storico.</p>';
                return;
            }

            db.workouts.forEach(w => {
                const item = document.createElement('div');
                item.className = 'bg-slate-900/60 border border-slate-700/60 rounded-lg p-2.5 flex justify-between items-center text-xs';
                item.innerHTML = `
                    <div class="space-y-0.5">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-emerald-400">${w.date}</span>
                            <span class="bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded text-[10px] border border-slate-700">${w.scheda}</span>
                        </div>
                        <p class="text-slate-300">${w.details}</p>
                    </div>
                    <button onclick="deleteWorkoutLog(${w.id})" title="Elimina registrazione" class="text-slate-500 hover:text-red-400 p-1 transition-colors">
                        <i class="ph ph-trash text-base"></i>
                    </button>
                `;
                list.appendChild(item);
            });
        }

        // 6. CONTATORI E TEMPLATE EXCEL
        function updateDashboardCounters() {
            document.getElementById('totalWorkoutsCount').textContent = db.workouts.length;

            const daysElem = document.getElementById('daysSinceLastWorkout');
            if (db.workouts.length === 0) {
                daysElem.textContent = "-";
                return;
            }

            const latestDate = new Date(db.workouts[0].date);
            const today = new Date();
            latestDate.setHours(0,0,0,0);
            today.setHours(0,0,0,0);

            const diffTime = today - latestDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

            daysElem.textContent = diffDays < 0 ? 0 : diffDays;
        }

        function downloadExcelTemplate() {
            const templateData = [
                { Esercizio: "Panca Piana", Macchinario: "Bilanciere", Serie: 4, Ripetizioni: 8, Kg: 80, Note: "Recupero 2 min" },
                { Esercizio: "Lat Machine", Macchinario: "Cavo", Serie: 3, Ripetizioni: 10, Kg: 60, Note: "Presa inversa" }
            ];
            const worksheet = XLSX.utils.json_to_sheet(templateData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Template Scheda");
            XLSX.writeFile(workbook, "Template_Scheda_Allenamento.xlsx");
        }

        function exportWorkoutsToExcel() {
            if (db.workouts.length === 0) {
                alert("Nessun dato da esportare nello storico!");
                return;
            }
            const exportData = db.workouts.map(w => ({
                Data: w.date,
                SchedaVersione: w.scheda,
                DettagliNote: w.details
            }));
            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Storico Allenamenti");
            XLSX.writeFile(workbook, "Storico_Allenamenti_Export.xlsx");
        }
    </script>
</body>
</html>

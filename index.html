<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fitness Tracker PWA</title>
    
    <!-- Meta tag WebApp / PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="data:application/manifest+json;utf8,{
        %22name%22:%22Fitness%20Tracker%22,
        %22short_name%22:%22FitnessPWA%22,
        %22start_url%22:%22./%22,
        %22display%22:%22standalone%22,
        %22background_color%22:%22%230f172a%22,
        %22theme_color%22:%22%230f172a%22
    }">

    <!-- CDN Tailwind CSS, SheetJS e Phosphor Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .page-section {
            display: none;
        }
        .page-section.active {
            display: block;
        }
    </style>
</head>
<body class="p-4 max-w-xl mx-auto pb-12 relative min-h-screen">

    <!-- BARRA DI NAVIGAZIONE SUPERIORE CON HAMBURGER MENU -->
    <header class="flex justify-between items-center bg-slate-800 border border-slate-700 rounded-xl p-3.5 mb-4 shadow-lg sticky top-2 z-30">
        <div class="flex items-center gap-2 cursor-pointer" onclick="showSection('home')">
            <i class="ph ph-barbell text-2xl text-emerald-400"></i>
            <span class="font-bold text-base text-white tracking-wide">Fitness PWA</span>
        </div>
        <button onclick="toggleMenu()" class="p-2 text-slate-300 hover:text-emerald-400 text-2xl focus:outline-none">
            <i class="ph ph-list"></i>
        </button>
    </header>

    <!-- SIDEBAR HAMBURGER MENU (A SCOMPARSA) -->
    <div id="sidebarOverlay" onclick="toggleMenu()" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-40 hidden transition-opacity"></div>
    <aside id="sidebar" class="fixed top-0 right-0 w-64 h-full bg-slate-900 border-l border-slate-800 p-5 z-50 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col justify-between">
        <div>
            <div class="flex justify-between items-center pb-4 border-b border-slate-800 mb-4">
                <span class="font-bold text-emerald-400 flex items-center gap-2">
                    <i class="ph ph-user-circle text-xl"></i> Menu App
                </span>
                <button onclick="toggleMenu()" class="text-slate-400 hover:text-white text-xl">
                    <i class="ph ph-x"></i>
                </button>
            </div>
            <nav class="space-y-2">
                <button onclick="navigateTo('home')" class="w-full text-left p-2.5 rounded-lg hover:bg-slate-800 text-slate-200 flex items-center gap-3 text-sm font-medium">
                    <i class="ph ph-house text-emerald-400 text-lg"></i> Homepage
                </button>
                <button onclick="navigateTo('registra')" class="w-full text-left p-2.5 rounded-lg hover:bg-slate-800 text-slate-200 flex items-center gap-3 text-sm font-medium">
                    <i class="ph ph-plus-circle text-emerald-400 text-lg"></i> Nuova Registrazione
                </button>
                <button onclick="navigateTo('repository')" class="w-full text-left p-2.5 rounded-lg hover:bg-slate-800 text-slate-200 flex items-center gap-3 text-sm font-medium">
                    <i class="ph ph-folders text-emerald-400 text-lg"></i> Repository Schede
                </button>
                <button onclick="navigateTo('storico')" class="w-full text-left p-2.5 rounded-lg hover:bg-slate-800 text-slate-200 flex items-center gap-3 text-sm font-medium">
                    <i class="ph ph-clock-counter-clockwise text-emerald-400 text-lg"></i> Storico Allenamenti
                </button>
                <button onclick="navigateTo('obiettivi')" class="w-full text-left p-2.5 rounded-lg hover:bg-slate-800 text-slate-200 flex items-center gap-3 text-sm font-medium">
                    <i class="ph ph-target text-emerald-400 text-lg"></i> Obiettivi e Peso
                </button>
            </nav>
        </div>
        <div class="pt-4 border-t border-slate-800 text-center">
            <span class="text-[10px] text-slate-500 font-mono">PWA Status: Ready / Offline</span>
        </div>
    </aside>

    <!-- SEZIONE 1: HOMEPAGE (DASHBOARD RECAP) -->
    <section id="sec-home" class="page-section active space-y-4">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-semibold text-emerald-400">Riepilogo Attività</h2>
                <span class="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded" id="homeActiveBadge">Scheda: -</span>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-slate-900/60 p-3 rounded-lg border border-slate-700/50 text-center">
                    <p class="text-[11px] text-slate-400 mb-0.5">Giorni Inattività</p>
                    <p class="text-2xl font-black text-emerald-400" id="daysSinceLastWorkout">-</p>
                </div>
                <div class="bg-slate-900/60 p-3 rounded-lg border border-slate-700/50 text-center">
                    <p class="text-[11px] text-slate-400 mb-0.5">Sessioni Totali</p>
                    <p class="text-2xl font-black text-blue-400" id="totalWorkoutsCount">0</p>
                </div>
            </div>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg flex justify-between items-center">
            <div>
                <p class="text-xs text-slate-400">Ultimo Peso Registrato</p>
                <p class="text-xl font-bold text-white" id="homeWeightDisplay">- kg</p>
            </div>
            <button onclick="navigateTo('obiettivi')" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg">
                Aggiorna
            </button>
        </div>

        <div class="space-y-2">
            <button onclick="navigateTo('registra')" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl text-sm transition-colors flex items-center justify-center gap-2 shadow-lg">
                <i class="ph ph-plus-circle text-lg"></i> Nuova Registrazione Allenamento
            </button>
            <button onclick="navigateTo('repository')" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2.5 rounded-xl text-xs border border-slate-700 transition-colors flex items-center justify-center gap-2">
                <i class="ph ph-folders text-base"></i> Gestisci Repository Schede
            </button>
        </div>
    </section>

    <!-- SEZIONE 2: REGISTRAZIONE ALLENAMENTO -->
    <section id="sec-registra" class="page-section">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg">
            <h2 class="text-base font-semibold text-emerald-400 mb-3 flex items-center gap-2">
                <i class="ph ph-plus-circle text-lg"></i> Registra Allenamento
            </h2>
            <div class="space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Data</label>
                        <input type="date" id="logDate" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Versione Scheda</label>
                        <select id="logSchedaSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                            <option value="">Seleziona...</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Dettagli / Note Sessione</label>
                    <input type="text" id="logDetails" placeholder="Es. Giorno A - Panca 4x8 @80kg" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                </div>
                <button onclick="addWorkoutLog()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 rounded-lg text-xs transition-colors flex items-center justify-center gap-2">
                    <i class="ph ph-check-circle text-lg"></i> Salva Allenamento
                </button>
            </div>
        </div>
    </section>

    <!-- SEZIONE 3: REPOSITORY SCHEDE -->
    <section id="sec-repository" class="page-section">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-base font-semibold text-emerald-400 flex items-center gap-2">
                    <i class="ph ph-folders text-lg"></i> Repository Schede
                </h2>
                <button onclick="downloadExcelTemplate()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1 rounded-md transition-colors flex items-center gap-1">
                    <i class="ph ph-download-simple"></i> Template .xlsx
                </button>
            </div>

            <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700/60 space-y-2">
                <input type="text" id="schedaVersionName" placeholder="Nome versione (es. Scheda Ipertrofia 2026)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" class="block w-full text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-slate-200 hover:file:bg-slate-600">
                <button onclick="uploadSchedaToRepository()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-semibold py-1.5 rounded-lg text-xs transition-colors flex items-center justify-center gap-1">
                    <i class="ph ph-upload-simple"></i> Aggiungi a Repository
                </button>
            </div>

            <div class="space-y-1.5">
                <label class="block text-xs text-slate-400 mb-1">Schede Salvate</label>
                <div id="repositoryList" class="space-y-1.5"></div>
            </div>
        </div>
    </section>

    <!-- SEZIONE 4: STORICO REGISTRAZIONI -->
    <section id="sec-storico" class="page-section">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-base font-semibold text-emerald-400 flex items-center gap-2">
                    <i class="ph ph-clock-counter-clockwise text-lg"></i> Storico Registrazioni
                </h2>
                <button onclick="exportWorkoutsToExcel()" class="text-xs bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-3 py-1 rounded-md transition-colors flex items-center gap-1">
                    <i class="ph ph-file-xls text-sm"></i> Esporta XLSX
                </button>
            </div>
            <div id="historyList" class="space-y-2 max-h-96 overflow-y-auto pr-1"></div>
        </div>
    </section>

    <!-- SEZIONE 5: OBIETTIVI E TRACCIAMENTO PESO -->
    <section id="sec-obiettivi" class="page-section space-y-4">
        <!-- Scheda Obiettivo -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg">
            <h2 class="text-base font-semibold text-emerald-400 mb-3 flex items-center gap-2">
                <i class="ph ph-target text-lg"></i> Obiettivi Fitness
            </h2>
            <div class="space-y-2">
                <textarea id="targetGoalText" placeholder="Es. Raggiungere 80kg, aumentare panca piana a 100kg..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-emerald-500 h-20"></textarea>
                <button onclick="saveGoal()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-semibold py-1.5 rounded-lg text-xs transition-colors">
                    Salva Obiettivo
                </button>
            </div>
        </div>

        <!-- Tracciamento Peso Corporeo -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg space-y-3">
            <h2 class="text-base font-semibold text-emerald-400 flex items-center gap-2">
                <i class="ph ph-scales text-lg"></i> Registro Peso Corporeo
            </h2>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Data</label>
                    <input type="date" id="weightDate" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Peso (kg)</label>
                    <input type="number" step="0.1" id="weightVal" placeholder="Es. 78.5" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                </div>
            </div>
            <button onclick="addWeightLog()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2 rounded-lg text-xs transition-colors">
                Registra Peso
            </button>

            <div class="pt-2 border-t border-slate-700/60">
                <label class="block text-xs text-slate-400 mb-2">Storico Peso</label>
                <div id="weightHistoryList" class="space-y-1.5 max-h-48 overflow-y-auto"></div>
            </div>
        </div>
    </section>

    <!-- SCRIPT APPLICAZIONE -->
    <script>
        // Database Locale
        let db = {
            repository: JSON.parse(localStorage.getItem('pwa_repository')) || {},
            activeSchedaKey: localStorage.getItem('pwa_active_scheda') || null,
            workouts: JSON.parse(localStorage.getItem('pwa_workouts')) || [],
            weights: JSON.parse(localStorage.getItem('pwa_weights')) || [],
            goal: localStorage.getItem('pwa_goal') || ''
        };

        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('logDate').value = today;
            document.getElementById('weightDate').value = today;
            
            document.getElementById('targetGoalText').value = db.goal;

            renderRepository();
            renderWorkouts();
            renderWeights();
            updateDashboardCounters();
        });

        // GESTIONE NAVIGAZIONE & SIDEBAR HAMBURGER
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const isHidden = sidebar.classList.contains('translate-x-full');

            if (isHidden) {
                sidebar.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function navigateTo(sectionId) {
            toggleMenu();
            showSection(sectionId);
        }

        function showSection(sectionId) {
            document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
            const target = document.getElementById(`sec-${sectionId}`);
            if (target) target.classList.add('active');
        }

        // REPOSITORY SCHEDE
        function uploadSchedaToRepository() {
            const versionName = document.getElementById('schedaVersionName').value.trim();
            const fileInput = document.getElementById('excelFileInput');
            const file = fileInput.files[0];

            if (!versionName || !file) {
                alert("Compila il nome della versione e seleziona un file Excel!");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);

                db.repository[versionName] = jsonData;
                db.activeSchedaKey = versionName;

                localStorage.setItem('pwa_repository', JSON.stringify(db.repository));
                localStorage.setItem('pwa_active_scheda', db.activeSchedaKey);

                document.getElementById('schedaVersionName').value = '';
                fileInput.value = '';

                renderRepository();
            };
            reader.readAsArrayBuffer(file);
        }

        function renderRepository() {
            const listContainer = document.getElementById('repositoryList');
            const selectLog = document.getElementById('logSchedaSelect');
            const badge = document.getElementById('homeActiveBadge');

            listContainer.innerHTML = '';
            selectLog.innerHTML = '<option value="">Nessuna / Allenamento Libero</option>';

            const keys = Object.keys(db.repository);

            if (keys.length === 0) {
                listContainer.innerHTML = '<p class="text-xs text-slate-500 italic">Nessuna scheda presente.</p>';
                badge.textContent = "Scheda: Nessuna";
                return;
            }

            if (!db.activeSchedaKey || !db.repository[db.activeSchedaKey]) {
                db.activeSchedaKey = keys[0];
                localStorage.setItem('pwa_active_scheda', db.activeSchedaKey);
            }

            badge.textContent = `Scheda: ${db.activeSchedaKey}`;

            keys.forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = key;
                if (key === db.activeSchedaKey) opt.selected = true;
                selectLog.appendChild(opt);

                const item = document.createElement('div');
                item.className = `p-2 rounded-lg border text-xs flex justify-between items-center ${key === db.activeSchedaKey ? 'bg-slate-900 border-emerald-500/80 text-emerald-400' : 'bg-slate-900/60 border-slate-700/60 text-slate-300'}`;
                
                item.innerHTML = `
                    <div class="flex items-center gap-2 cursor-pointer flex-1" onclick="setActiveScheda('${key}')">
                        <i class="ph ${key === db.activeSchedaKey ? 'ph-check-circle text-emerald-400' : 'ph-circle text-slate-500'} text-base"></i>
                        <span class="font-medium truncate">${key}</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="downloadScheda('${key}')" class="p-1 hover:text-blue-400 text-slate-400">
                            <i class="ph ph-download-simple text-base"></i>
                        </button>
                        <button onclick="deleteScheda('${key}')" class="p-1 hover:text-red-400 text-slate-400">
                            <i class="ph ph-trash text-base"></i>
                        </button>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        function setActiveScheda(key) {
            db.activeSchedaKey = key;
            localStorage.setItem('pwa_active_scheda', key);
            renderRepository();
        }

        function downloadScheda(key) {
            if (!db.repository[key]) return;
            const worksheet = XLSX.utils.json_to_sheet(db.repository[key]);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Scheda");
            XLSX.writeFile(workbook, `${key.replace(/\s+/g, '_')}.xlsx`);
        }

        function deleteScheda(key) {
            if (!confirm(`Vuoi eliminare la scheda "${key}"?`)) return;
            delete db.repository[key];
            const keys = Object.keys(db.repository);
            db.activeSchedaKey = keys.length > 0 ? keys[0] : null;

            localStorage.setItem('pwa_repository', JSON.stringify(db.repository));
            if (db.activeSchedaKey) localStorage.setItem('pwa_active_scheda', db.activeSchedaKey);
            else localStorage.removeItem('pwa_active_scheda');

            renderRepository();
        }

        // WORKOUT LOGS
        function addWorkoutLog() {
            const date = document.getElementById('logDate').value;
            const scheda = document.getElementById('logSchedaSelect').value || 'Generica';
            const details = document.getElementById('logDetails').value.trim();

            if (!date) {
                alert("Seleziona una data!");
                return;
            }

            db.workouts.unshift({
                id: Date.now(),
                date,
                scheda,
                details: details || 'Allenamento completato'
            });

            db.workouts.sort((a, b) => new Date(b.date) - new Date(a.date));
            localStorage.setItem('pwa_workouts', JSON.stringify(db.workouts));
            document.getElementById('logDetails').value = '';

            renderWorkouts();
            updateDashboardCounters();
            showSection('home');
        }

        function deleteWorkoutLog(id) {
            if (!confirm("Vuoi eliminare la registrazione?")) return;
            db.workouts = db.workouts.filter(w => w.id !== id);
            localStorage.setItem('pwa_workouts', JSON.stringify(db.workouts));
            renderWorkouts();
            updateDashboardCounters();
        }

        function renderWorkouts() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';

            if (db.workouts.length === 0) {
                list.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Nessun allenamento registrato.</p>';
                return;
            }

            db.workouts.forEach(w => {
                const item = document.createElement('div');
                item.className = 'bg-slate-900/60 border border-slate-700/60 rounded-lg p-2.5 flex justify-between items-center text-xs';
                item.innerHTML = `
                    <div class="space-y-0.5">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-emerald-400">${w.date}</span>
                            <span class="bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded text-[10px] border border-slate-700">${w.scheda}</span>
                        </div>
                        <p class="text-slate-300">${w.details}</p>
                    </div>
                    <button onclick="deleteWorkoutLog(${w.id})" class="text-slate-500 hover:text-red-400 p-1">
                        <i class="ph ph-trash text-base"></i>
                    </button>
                `;
                list.appendChild(item);
            });
        }

        // TRACCIAMENTO PESO E OBIETTIVI
        function saveGoal() {
            const txt = document.getElementById('targetGoalText').value;
            db.goal = txt;
            localStorage.setItem('pwa_goal', txt);
            alert("Obiettivo salvato!");
        }

        function addWeightLog() {
            const date = document.getElementById('weightDate').value;
            const weight = parseFloat(document.getElementById('weightVal').value);

            if (!date || isNaN(weight)) {
                alert("Inserisci data e valore di peso valido!");
                return;
            }

            db.weights.unshift({ id: Date.now(), date, weight });
            db.weights.sort((a, b) => new Date(b.date) - new Date(a.date));

            localStorage.setItem('pwa_weights', JSON.stringify(db.weights));
            document.getElementById('weightVal').value = '';

            renderWeights();
        }

        function deleteWeightLog(id) {
            if (!confirm("Eliminare questa misurazione?")) return;
            db.weights = db.weights.filter(w => w.id !== id);
            localStorage.setItem('pwa_weights', JSON.stringify(db.weights));
            renderWeights();
        }

        function renderWeights() {
            const list = document.getElementById('weightHistoryList');
            const homeDisplay = document.getElementById('homeWeightDisplay');
            list.innerHTML = '';

            if (db.weights.length === 0) {
                list.innerHTML = '<p class="text-xs text-slate-500 italic">Nessun peso registrato.</p>';
                homeDisplay.textContent = '- kg';
                return;
            }

            homeDisplay.textContent = `${db.weights[0].weight} kg`;

            db.weights.forEach(w => {
                const item = document.createElement('div');
                item.className = 'bg-slate-900/60 border border-slate-700/60 rounded-lg p-2 flex justify-between items-center text-xs';
                item.innerHTML = `
                    <span class="text-slate-400">${w.date}</span>
                    <span class="font-bold text-white">${w.weight} kg</span>
                    <button onclick="deleteWeightLog(${w.id})" class="text-slate-500 hover:text-red-400 p-0.5">
                        <i class="ph ph-trash text-sm"></i>
                    </button>
                `;
                list.appendChild(item);
            });
        }

        // CONTATORI E UTILITIES
        function updateDashboardCounters() {
            document.getElementById('totalWorkoutsCount').textContent = db.workouts.length;

            const daysElem = document.getElementById('daysSinceLastWorkout');
            if (db.workouts.length === 0) {
                daysElem.textContent = "-";
                return;
            }

            const latestDate = new Date(db.workouts[0].date);
            const today = new Date();
            latestDate.setHours(0,0,0,0);
            today.setHours(0,0,0,0);

            const diffDays = Math.floor((today - latestDate) / (1000 * 60 * 60 * 24));
            daysElem.textContent = diffDays < 0 ? 0 : diffDays;
        }

        function downloadExcelTemplate() {
            const templateData = [
                { Esercizio: "Panca Piana", Macchinario: "Bilanciere", Serie: 4, Ripetizioni: 8, Kg: 80, Note: "Recupero 2 min" },
                { Esercizio: "Lat Machine", Macchinario: "Cavo", Serie: 3, Ripetizioni: 10, Kg: 60, Note: "Presa inversa" }
            ];
            const worksheet = XLSX.utils.json_to_sheet(templateData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Template Scheda");
            XLSX.writeFile(workbook, "Template_Scheda_Allenamento.xlsx");
        }

        function exportWorkoutsToExcel() {
            if (db.workouts.length === 0) {
                alert("Nessun dato da esportare!");
                return;
            }
            const exportData = db.workouts.map(w => ({
                Data: w.date,
                SchedaVersione: w.scheda,
                DettagliNote: w.details
            }));
            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Storico Allenamenti");
            XLSX.writeFile(workbook, "Storico_Allenamenti_Export.xlsx");
        }
    </script>
</body>
</html>

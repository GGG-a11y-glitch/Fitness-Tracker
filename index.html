<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker & Repository Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- SheetJS per Import/Export Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen pb-12 flex flex-col items-center">

<div class="w-full max-w-md px-4 pt-6 space-y-5">

    <!-- DASHBOARD: CONTATORI INATTIVITÀ & TOTALE ALLENAMENTI -->
    <div class="glass-card rounded-3xl p-5 text-center shadow-2xl relative overflow-hidden">
        <div class="absolute -right-10 -top-10 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl"></div>
        
        <div class="grid grid-cols-2 gap-4 divide-x divide-slate-700/50">
            <!-- Giorni da ultimo allenamento -->
            <div class="flex flex-col items-center justify-center">
                <p class="text-[10px] uppercase tracking-widest font-semibold text-slate-400">Giorni Fermo</p>
                <span id="daysWithoutWorkout" class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-indigo-400 my-1">0</span>
                <p id="statusBanner" class="text-[10px] font-medium text-slate-300">Calcolo...</p>
            </div>

            <!-- Contatore Totale Allenamenti -->
            <div class="flex flex-col items-center justify-center">
                <p class="text-[10px] uppercase tracking-widest font-semibold text-slate-400">Allenamenti Totali</p>
                <span id="totalWorkoutCounter" class="text-5xl font-extrabold text-indigo-400 my-1">0</span>
                <p class="text-[10px] font-medium text-slate-400">Sessioni registrate</p>
            </div>
        </div>
    </div>

    <!-- 1) IN ALTO: SEZIONE REGISTRAZIONE ALLENAMENTO -->
    <div class="glass-card rounded-3xl p-5 space-y-4 border-emerald-500/30">
        <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
            <div class="flex items-center gap-2">
                <i class="ph ph-plus-circle text-emerald-400 text-xl"></i>
                <h2 class="text-sm font-bold text-slate-100 uppercase tracking-wider">Registra Allenamento</h2>
            </div>
            <span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full font-medium">Azione Rapida</span>
        </div>

        <div class="space-y-3">
            <div>
                <label class="block text-[11px] font-medium text-slate-400 mb-1">Data Sessione</label>
                <input type="date" id="logDate" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl p-3 focus:outline-none focus:border-emerald-500">
            </div>

            <div>
                <label class="block text-[11px] font-medium text-slate-400 mb-1">Seleziona Scheda / Workout</label>
                <select id="logSchedaSelect" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl p-3 focus:outline-none focus:border-emerald-500">
                </select>
            </div>

            <div>
                <label class="block text-[11px] font-medium text-slate-400 mb-1">Note / Focus Workout (Opzionale)</label>
                <input type="text" id="logNotes" placeholder="Es. Giorno A - Aumentato carico panca 2.5kg" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl p-3 focus:outline-none focus:border-emerald-500">
            </div>

            <!-- BOTTONCINO PER LA REGISTRAZIONE -->
            <button id="quickSaveLogBtn" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] transition-all rounded-xl font-bold text-white text-xs shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2">
                <i class="ph ph-check-circle text-lg"></i> Salva Registrazione
            </button>
        </div>
    </div>

    <!-- 3) STORICO ALLENAMENTI CON OPZIONE CANCELLAZIONE -->
    <div class="glass-card rounded-2xl p-5 space-y-4">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="ph ph-clock-counter-clockwise text-indigo-400 text-lg"></i>
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-300">Storico Registrazioni</h3>
            </div>
            <button id="exportAllDataBtn" class="text-xs text-indigo-400 hover:text-indigo-300 font-semibold flex items-center gap-1">
                <i class="ph ph-download-simple text-sm"></i> Esporta Excel
            </button>
        </div>

        <ul id="historyList" class="space-y-2.5 max-h-56 overflow-y-auto pr-1">
        </ul>
    </div>

    <!-- 2) REPOSITORY SCHEDE CON TEMPLATE SCARICABILE -->
    <div class="glass-card rounded-2xl p-5 space-y-4">
        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-300">Repository Schede</h3>
            <!-- BOTTONE SCARICA TEMPLATE VUOTO -->
            <button id="downloadTemplateBtn" class="text-xs text-emerald-400 hover:text-emerald-300 font-semibold flex items-center gap-1 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1 rounded-lg">
                <i class="ph ph-file-arrow-down text-base"></i> Scarica Template Vuoto
            </button>
        </div>

        <!-- Form Caricamento Nuova Versione Scheda -->
        <div class="space-y-3 bg-slate-800/40 p-3.5 rounded-xl border border-slate-800">
            <p class="text-xs font-semibold text-slate-300">Carica Nuova Scheda (.xlsx)</p>
            <div>
                <label class="block text-[10px] text-slate-400 mb-1">Nome Versione / Scheda</label>
                <input type="text" id="schedaVersionName" placeholder="Es. Scheda Ipertrofia 2026" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-lg p-2.5 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-[10px] text-slate-400 mb-1">File Excel popolato</label>
                <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" class="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
            </div>
            <button id="uploadSchedaBtn" class="w-full py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-bold text-slate-200 transition-all">
                Aggiungi a Repository
            </button>
        </div>

        <!-- Selettore Scheda Attiva e Anteprima Tabella -->
        <div class="space-y-2">
            <label class="block text-xs font-semibold text-slate-300">Visualizza Scheda Salvata</label>
            <select id="repositorySelect" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-xl p-2.5 focus:outline-none focus:border-indigo-500">
            </select>
        </div>

        <div id="schedaDisplayContainer" class="max-h-48 overflow-x-auto overflow-y-auto rounded-xl border border-slate-800 bg-slate-900/50">
        </div>
    </div>

</div>

<script>
// KEYS STORAGE LOCALE
const REPO_KEY = 'workout_pwa_repository_v3';
const LOGS_KEY = 'workout_pwa_logs_v3';
const ACTIVE_KEY = 'workout_pwa_active_v3';

// STATO
let db = {
    repository: JSON.parse(localStorage.getItem(REPO_KEY)) || {},
    logs: JSON.parse(localStorage.getItem(LOGS_KEY)) || [],
    activeSchedaKey: localStorage.getItem(ACTIVE_KEY) || null
};

// DOM ELEMENTS
const daysWithoutWorkout = document.getElementById('daysWithoutWorkout');
const totalWorkoutCounter = document.getElementById('totalWorkoutCounter');
const statusBanner = document.getElementById('statusBanner');

const logDate = document.getElementById('logDate');
const logSchedaSelect = document.getElementById('logSchedaSelect');
const logNotes = document.getElementById('logNotes');
const quickSaveLogBtn = document.getElementById('quickSaveLogBtn');

const schedaVersionName = document.getElementById('schedaVersionName');
const excelFileInput = document.getElementById('excelFileInput');
const uploadSchedaBtn = document.getElementById('uploadSchedaBtn');
const downloadTemplateBtn = document.getElementById('downloadTemplateBtn');

const repositorySelect = document.getElementById('repositorySelect');
const schedaDisplayContainer = document.getElementById('schedaDisplayContainer');
const historyList = document.getElementById('historyList');
const exportAllDataBtn = document.getElementById('exportAllDataBtn');

// INIT
document.addEventListener('DOMContentLoaded', () => {
    // Data odierna come default
    logDate.value = new Date().toISOString().split('T')[0];
    
    renderRepositorySelect();
    renderSchedaTable();
    renderHistoryAndDashboard();
});

// 1 & 4) DASHBOARD: GIORNI SENZA ALLENAMENTO E CONTATORE TOTALE
function calculateDashboardMetrics() {
    totalWorkoutCounter.textContent = db.logs.length;

    if (db.logs.length === 0) {
        daysWithoutWorkout.textContent = '-';
        statusBanner.textContent = 'Nessuna registrazione';
        statusBanner.className = 'text-[10px] font-medium text-slate-400';
        return;
    }

    const sortedLogs = [...db.logs].sort((a, b) => new Date(b.date) - new Date(a.date));
    const lastDate = new Date(sortedLogs[0].date);
    const today = new Date();
    
    lastDate.setHours(0,0,0,0);
    today.setHours(0,0,0,0);

    const diffTime = today - lastDate;
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

    daysWithoutWorkout.textContent = diffDays;

    if (diffDays === 0) {
        statusBanner.textContent = 'Allenato oggi! Great job';
        statusBanner.className = 'text-[10px] font-medium text-emerald-400';
    } else if (diffDays === 1) {
        statusBanner.textContent = 'Ieri giorno di allenamento/riposo';
        statusBanner.className = 'text-[10px] font-medium text-indigo-300';
    } else if (diffDays >= 3) {
        statusBanner.textContent = `Fermo da ${diffDays} giorni!`;
        statusBanner.className = 'text-[10px] font-medium text-rose-400';
    } else {
        statusBanner.textContent = `Fermo da ${diffDays} giorni`;
        statusBanner.className = 'text-[10px] font-medium text-slate-300';
    }
}

// 1) BOTTONE DI REGISTRAZIONE ALLENAMENTO
quickSaveLogBtn.addEventListener('click', () => {
    const dateVal = logDate.value;
    const schedaVal = logSchedaSelect.value || 'Allenamento Libero';
    const notesVal = logNotes.value.trim();

    if (!dateVal) {
        alert('Seleziona una data valida per la registrazione.');
        return;
    }

    const newLog = {
        id: Date.now(),
        date: dateVal,
        schedaName: schedaVal,
        notes: notesVal || 'Sessione Completata'
    };

    db.logs.push(newLog);
    localStorage.setItem(LOGS_KEY, JSON.stringify(db.logs));

    logNotes.value = '';
    renderHistoryAndDashboard();
});

// 2) DOWNLOAD TEMPLATE EXCEL VUOTO CON INTESTAZIONI NECESSARIE
downloadTemplateBtn.addEventListener('click', () => {
    // Template vuoto con intestazioni standard
    const emptyTemplateData = [
        { Esercizio: "", Macchinario: "", Serie: "", Ripetizioni: "", Kg: "", Note: "" }
    ];

    const ws = XLSX.utils.json_to_sheet(emptyTemplateData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Scheda_Template");
    XLSX.writeFile(wb, "Template_Scheda_Vuoto.xlsx");
});

// CARICAMENTO ED IMPORT EXCEL POPOLATO
uploadSchedaBtn.addEventListener('click', () => {
    const versionName = schedaVersionName.value.trim();
    const file = excelFileInput.files[0];

    if (!versionName) {
        alert('Inserisci un nome per identificare la scheda.');
        return;
    }
    if (!file) {
        alert('Seleziona un file Excel (.xlsx).');
        return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const jsonData = XLSX.utils.sheet_to_json(firstSheet);

        db.repository[versionName] = jsonData;
        db.activeSchedaKey = versionName;

        localStorage.setItem(REPO_KEY, JSON.stringify(db.repository));
        localStorage.setItem(ACTIVE_KEY, db.activeSchedaKey);

        schedaVersionName.value = '';
        excelFileInput.value = '';

        renderRepositorySelect();
        renderSchedaTable();
    };
    reader.readAsArrayBuffer(file);
});

// RENDERING DROMDOWN SCHEDE
function renderRepositorySelect() {
    repositorySelect.innerHTML = '';
    logSchedaSelect.innerHTML = '';

    const keys = Object.keys(db.repository);
    if (keys.length === 0) {
        repositorySelect.innerHTML = '<option value="">Nessuna scheda salvata</option>';
        logSchedaSelect.innerHTML = '<option value="Allenamento Libero">Allenamento Libero (Senza Scheda)</option>';
        return;
    }

    keys.forEach(key => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = key;
        if (key === db.activeSchedaKey) opt.selected = true;
        repositorySelect.appendChild(opt);

        const logOpt = document.createElement('option');
        logOpt.value = key;
        logOpt.textContent = key;
        logSchedaSelect.appendChild(logOpt);
    });
}

repositorySelect.addEventListener('change', (e) => {
    db.activeSchedaKey = e.target.value;
    localStorage.setItem(ACTIVE_KEY, db.activeSchedaKey);
    renderSchedaTable();
});

// VISUALIZZAZIONE TABELLA SCHEDA SELEZIONATA
function renderSchedaTable() {
    schedaDisplayContainer.innerHTML = '';
    
    if (!db.activeSchedaKey || !db.repository[db.activeSchedaKey]) {
        schedaDisplayContainer.innerHTML = '<p class="text-xs text-slate-500 p-4 text-center">Seleziona o carica una scheda.</p>';
        return;
    }

    const data = db.repository[db.activeSchedaKey];
    if (data.length === 0) {
        schedaDisplayContainer.innerHTML = '<p class="text-xs text-slate-500 p-4 text-center">Scheda vuota.</p>';
        return;
    }

    let html = '<table class="w-full text-left text-xs text-slate-300"><thead class="bg-slate-800 text-indigo-400 font-semibold border-b border-slate-700"><tr>';
    Object.keys(data[0]).forEach(k => html += `<th class="p-2 whitespace-nowrap">${k}</th>`);
    html += '</tr></thead><tbody>';

    data.forEach(row => {
        html += '<tr class="border-b border-slate-800/60 hover:bg-slate-800/30">';
        Object.values(row).forEach(v => html += `<td class="p-2 whitespace-nowrap">${v !== undefined ? v : ''}</td>`);
        html += '</tr>';
    });

    html += '</tbody></table>';
    schedaDisplayContainer.innerHTML = html;
}

// 3) ELIMINAZIONE SINGOLA REGISTRAZIONE NELLO STORICO
function deleteLogItem(id) {
    if (confirm('Vuoi eliminare questa registrazione?')) {
        db.logs = db.logs.filter(item => item.id !== id);
        localStorage.setItem(LOGS_KEY, JSON.stringify(db.logs));
        renderHistoryAndDashboard();
    }
}

// RENDERING STORICO ED AGGIORNAMENTO
function renderHistoryAndDashboard() {
    historyList.innerHTML = '';
    calculateDashboardMetrics();

    if (db.logs.length === 0) {
        historyList.innerHTML = '<li class="text-xs text-slate-500 text-center py-4">Nessun allenamento ancora registrato.</li>';
        return;
    }

    const sorted = [...db.logs].sort((a, b) => new Date(b.date) - new Date(a.date));

    sorted.forEach(log => {
        const li = document.createElement('li');
        li.className = 'flex justify-between items-center p-3 rounded-xl bg-slate-800/40 border border-slate-800/80';
        li.innerHTML = `
            <div>
                <p class="text-xs font-bold text-slate-200">${log.schedaName}</p>
                <p class="text-[10px] text-emerald-400 font-medium">${log.notes}</p>
                <p class="text-[10px] text-slate-500 mt-0.5">${new Date(log.date).toLocaleDateString('it-IT', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' })}</p>
            </div>
            <button onclick="deleteLogItem(${log.id})" class="text-slate-500 hover:text-rose-400 p-1.5 transition-colors" title="Elimina Registrazione">
                <i class="ph ph-trash text-lg"></i>
            </button>
        `;
        historyList.appendChild(li);
    });
}

// ESPORTAZIONE EXCEL STORICO
exportAllDataBtn.addEventListener('click', () => {
    if (db.logs.length === 0) {
        alert('Nessuna registrazione da esportare.');
        return;
    }

    const exportFormatted = db.logs.map(l => ({
        Data: l.date,
        Scheda_Eseguita: l.schedaName,
        Note: l.notes
    }));

    const ws = XLSX.utils.json_to_sheet(exportFormatted);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Storico_Allenamenti");
    XLSX.writeFile(wb, `Storico_Allenamenti_${new Date().toISOString().split('T')[0]}.xlsx`);
});
</script>
</body>
</html>

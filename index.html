<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Fitness & Repository Schede</title>
    <!-- SheetJS per Import/Export Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-primary: #121212;
            --bg-card: #1e1e1e;
            --accent: #00e676;
            --text-main: #ffffff;
            --text-muted: #b0bec5;
            --border: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }
        h1, h2, h3 { color: var(--accent); margin-top: 0; }
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .form-group { margin-bottom: 12px; }
        label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            border: none;
        }
        button:hover { opacity: 0.9; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.85rem;
        }
        th, td {
            border: 1px solid var(--border);
            padding: 8px;
            text-align: left;
        }
        th { background-color: #2a2a2a; color: var(--accent); }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .badge {
            background-color: var(--accent);
            color: #000;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Fitness & Repository Schede</h1>

    <!-- REPOSITORY E SCHEDA ATTIVA -->
    <div class="card">
        <h2>Repository Schede Allenamento</h2>
        
        <!-- Caricamento Nuova Scheda -->
        <div class="form-group">
            <label>1. Assegna un Nome a questa Versione</label>
            <input type="text" id="schedaVersionName" placeholder="Es. Scheda Forza Q4 2026">
        </div>
        <div class="form-group">
            <label>2. Seleziona File Excel (.xlsx / .csv)</label>
            <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv">
        </div>
        <button onclick="uploadSchedaToRepository()">Carica e Salva in Repository</button>

        <hr style="border-color: var(--border); margin: 20px 0;">

        <!-- Selettore Scheda Attiva -->
        <div class="form-group">
            <label>Seleziona Scheda Attiva dalla Repository</label>
            <select id="repositorySelect" onchange="switchActiveScheda()"></select>
        </div>

        <!-- Visualizzazione Scheda Corrente -->
        <h3>Scheda In Uso: <span id="currentSchedaName" class="badge">Nessuna</span></h3>
        <div id="schedaContainer"></div>
    </div>

    <!-- REGISTRAZIONE ALLENAMENTI PREGRESSI -->
    <div class="card">
        <h2>Registrazione Allenamento</h2>
        <div class="grid-2">
            <div class="form-group">
                <label>Data</label>
                <input type="date" id="workoutDate">
            </div>
            <div class="form-group">
                <label>Esercizio</label>
                <input type="text" id="workoutExercise" placeholder="Es. Panca Piana">
            </div>
        </div>
        <div class="grid-2">
            <div class="form-group">
                <label>Serie x Ripetizioni</label>
                <input type="text" id="workoutReps" placeholder="Es. 4x8">
            </div>
            <div class="form-group">
                <label>Carico (kg)</label>
                <input type="number" id="workoutWeight" placeholder="80">
            </div>
        </div>
        <button onclick="addWorkout()">Salva Allenamento</button>

        <h3>Storico Registrazioni</h3>
        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Esercizio</th>
                    <th>Set x Reps</th>
                    <th>Kg</th>
                </tr>
            </thead>
            <tbody id="workoutHistoryTable"></tbody>
        </table>

        <button onclick="exportWorkoutsToExcel()" style="margin-top: 15px;">Esporta Storico in XLSX</button>
    </div>

    <script>
        // Stato del Database Locale
        let db = {
            repository: JSON.parse(localStorage.getItem('pwa_repository')) || {}, // { "NomeVersione": [data] }
            activeSchedaKey: localStorage.getItem('pwa_active_scheda') || null,
            workouts: JSON.parse(localStorage.getItem('pwa_workouts')) || []
        };

        document.addEventListener('DOMContentLoaded', () => {
            renderRepositorySelect();
            renderActiveScheda();
            renderWorkouts();
        });

        // CARICAMENTO SCHEDA IN REPOSITORY
        function uploadSchedaToRepository() {
            const versionName = document.getElementById('schedaVersionName').value.trim();
            const fileInput = document.getElementById('excelFileInput');
            const file = fileInput.files[0];

            if (!versionName) {
                alert("Inserisci un nome identificativo per questa versione della scheda!");
                return;
            }
            if (!file) {
                alert("Seleziona un file Excel o CSV!");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);

                // Salva nella repository
                db.repository[versionName] = jsonData;
                db.activeSchedaKey = versionName;

                localStorage.setItem('pwa_repository', JSON.stringify(db.repository));
                localStorage.setItem('pwa_active_scheda', db.activeSchedaKey);

                // Reset Input
                document.getElementById('schedaVersionName').value = '';
                fileInput.value = '';

                renderRepositorySelect();
                renderActiveScheda();
            };
            reader.readAsArrayBuffer(file);
        }

        // AGGIORNA DROPDOWN REPOSITORY
        function renderRepositorySelect() {
            const select = document.getElementById('repositorySelect');
            select.innerHTML = '';

            const keys = Object.keys(db.repository);
            if (keys.length === 0) {
                select.innerHTML = '<option value="">Nessuna scheda presente in repository</option>';
                return;
            }

            keys.forEach(key => {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = key;
                if (key === db.activeSchedaKey) option.selected = true;
                select.appendChild(option);
            });
        }

        // CAMBIA SCHEDA ATTIVA
        function switchActiveScheda() {
            const select = document.getElementById('repositorySelect');
            if (!select.value) return;

            db.activeSchedaKey = select.value;
            localStorage.setItem('pwa_active_scheda', db.activeSchedaKey);
            renderActiveScheda();
        }

        // RENDERING SCHEDA ATTIVA IN TABELLA
        function renderActiveScheda() {
            const container = document.getElementById('schedaContainer');
            const label = document.getElementById('currentSchedaName');

            if (!db.activeSchedaKey || !db.repository[db.activeSchedaKey]) {
                label.textContent = "Nessuna";
                container.innerHTML = '<p style="color:var(--text-muted)">Nessuna scheda attiva. Carica una nuova versione o selezionala dalla repository.</p>';
                return;
            }

            label.textContent = db.activeSchedaKey;
            const data = db.repository[db.activeSchedaKey];

            if (data.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted)">La scheda selezionata è vuota.</p>';
                return;
            }

            let html = '<table><thead><tr>';
            Object.keys(data[0]).forEach(key => html += `<th>${key}</th>`);
            html += '</tr></thead><tbody>';
            data.forEach(row => {
                html += '<tr>';
                Object.values(row).forEach(val => html += `<td>${val}</td>`);
                html += '</tr>';
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // REGISTRAZIONE E STORICO ALLENAMENTI
        function addWorkout() {
            const date = document.getElementById('workoutDate').value;
            const exercise = document.getElementById('workoutExercise').value;
            const reps = document.getElementById('workoutReps').value;
            const weight = document.getElementById('workoutWeight').value;

            if (!date || !exercise) return;

            db.workouts.push({ date, exercise, reps, weight, schedaVersione: db.activeSchedaKey || 'N/D' });
            localStorage.setItem('pwa_workouts', JSON.stringify(db.workouts));
            renderWorkouts();
        }

        function renderWorkouts() {
            const tbody = document.getElementById('workoutHistoryTable');
            tbody.innerHTML = '';
            db.workouts.forEach(w => {
                tbody.innerHTML += `<tr><td>${w.date}</td><td>${w.exercise}</td><td>${w.reps}</td><td>${w.weight} kg</td></tr>`;
            });
        }

        function exportWorkoutsToExcel() {
            if (db.workouts.length === 0) return;
            const worksheet = XLSX.utils.json_to_sheet(db.workouts);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Storico Allenamenti");
            XLSX.writeFile(workbook, "Storico_Allenamenti.xlsx");
        }
    </script>
</body>
</html>
